<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#000000">
<title>fridaes pack bot</title>
<style>
  /* fridaes pack bot: black, white, lowercase. one spacing unit (16px) for every gap, padding and margin. */
  :root {
    color-scheme: dark;
    --u: 16px;
    --r: 10px; /* corner radius */
    --fg: #fff; --bg: #000;
    --line: 1px solid #fff;
    --dim: #fff; /* (no greys: emphasis is by weight, underline and inversion, not by colour) */
  }
  * { box-sizing: border-box; text-transform: lowercase; margin: 0; padding: 0; }
  html, body { background: var(--bg); }
  body { color: var(--fg); min-height: 100vh; font: 14px/1.5 ui-monospace, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace; }
  ::selection { background: #fff; color: #000; }
  * { scrollbar-width: thin; scrollbar-color: #fff #000; }
  ::-webkit-scrollbar { width: 8px; height: 8px; }
  ::-webkit-scrollbar-thumb { background: #fff; }
  ::-webkit-scrollbar-track { background: #000; }
  [hidden] { display: none !important; }
  img { max-width: 100%; }

  header { display: flex; flex-wrap: wrap; gap: var(--u); align-items: center; justify-content: space-between;
           padding: var(--u); position: sticky; top: 0; z-index: 5; background: var(--bg); border-bottom: var(--line); }
  .brand { display: flex; align-items: center; gap: var(--u); }
  .logo { width: 64px; height: 64px; object-fit: contain; display: block; flex: none; }
  .logo.spin { animation: spin 6s linear infinite; }
  .ring { border: 2px solid #fff; border-top-color: transparent; border-radius: 50%; }
  @keyframes spin { to { transform: rotate(360deg); } }
  @media (prefers-reduced-motion: reduce) { .logo.spin { animation-duration: 24s; } }
  h1 { font-size: 20px; font-weight: 700; letter-spacing: 1px; }
  .status { font-size: 12px; }
  .status::before { content: "\25CF  "; }
  #outbox.status::before { content: ""; }
  .head-right { display: flex; gap: var(--u); align-items: center; flex-wrap: wrap; }
  .balance { border: var(--line); padding: var(--u) var(--u); }
  .balance b { font-size: 16px; }
  .muted { font-size: 12px; font-weight: normal; }

  main { display: grid; grid-template-columns: 1fr 384px; gap: var(--u); padding: var(--u); max-width: 1536px; margin: 0 auto; }
  @media (max-width: 900px) { main { grid-template-columns: 1fr; } }
  section { border: var(--line); padding: var(--u); min-width: 0; }
  aside, .leftcol { display: grid; gap: var(--u); align-content: start; min-width: 0; }
  h2 { font-size: 14px; font-weight: 700; letter-spacing: 1px; margin-bottom: var(--u); display: flex; gap: var(--u); align-items: baseline; justify-content: space-between; }
  h2 .muted { margin-left: auto; letter-spacing: 0; }
  h3 { font-size: 12px; font-weight: 700; margin: var(--u) 0; text-decoration: underline; }

  button { font: inherit; color: var(--fg); background: transparent; border: var(--line); height: 40px; padding: 0 var(--u);
           cursor: pointer; border-radius: var(--r); font-weight: 700; }
  button:disabled { opacity: .4; cursor: default; background: transparent; color: var(--fg); }
  button.ghost { font-weight: 400; }
  input, select { font: inherit; color: var(--fg); background: var(--bg); border: var(--line); height: 40px; padding: 0 var(--u);
                  border-radius: var(--r); min-width: 0; outline: none; }
  input:focus, select:focus { outline: 1px solid #fff; outline-offset: 2px; }
  input::placeholder { color: #fff; opacity: .5; }
  input[type=checkbox] { height: auto; }
  select option { background: #000; color: #fff; }

  .tabs { display: flex; gap: var(--u); flex-wrap: wrap; }
  .tab .count { margin-left: var(--u); }
  .tab .count:empty { display: none; }
  .tab .count::before { content: "("; } .tab .count::after { content: ")"; }

  .modes { display: flex; gap: var(--u); flex-wrap: wrap; }
  #mode-note, #who-status, #mine-sum { margin: var(--u) 0; min-height: 1.5em; }
  form.send, .who-form { display: flex; gap: var(--u); flex-wrap: wrap; margin-top: var(--u); }
  form.send input, .who-form input { flex: 1 1 160px; }
  .who-form { margin-top: 0; }
  .who-form input#who-find { flex: 0 1 144px; }
  #rb-n { width: 80px; flex: none; }
  .rb-stats { display: flex; gap: var(--u); align-items: baseline; flex-wrap: wrap; }
  #rb-count { font-size: 24px; font-weight: 700; }

  .bidbox { display: flex; align-items: center; gap: var(--u); margin: var(--u) 0; padding: var(--u) var(--u); border: 1px dashed #fff; }
  .bidbox .dot { width: 8px; height: 8px; background: #fff; flex: none; }
  .bidbox.has { border-style: solid; font-weight: 700; }
  .switch { display: flex; align-items: center; gap: var(--u); cursor: pointer; user-select: none; }
  .switch input { position: absolute; opacity: 0; width: 0; height: 0; }
  .switch .track { width: 48px; height: 24px; border: var(--line); position: relative; flex: none; }
  .switch .thumb { position: absolute; top: 3px; left: 3px; width: 16px; height: 16px; background: #fff; }
  .switch input:checked + .track { background: #fff; }
  .switch input:checked + .track .thumb { transform: translateX(24px); background: #000; }
  .switch input:focus-visible + .track { outline: 1px solid #fff; outline-offset: 2px; }

  .cards, .ones { display: grid; grid-template-columns: repeat(auto-fill, minmax(192px, 1fr)); gap: var(--u); }
  .card, .one { border: var(--line); display: flex; flex-direction: column; min-width: 0; }
  .card:hover, .one:hover { outline: 1px solid #fff; outline-offset: 4px; }
  .card img, .one img { width: 100%; height: auto; display: block; background: #000; }
  .card .body { padding: var(--u); display: grid; gap: var(--u); }
  .card .name { font-weight: 700; display: flex; gap: var(--u); align-items: center; }
  .card .tag { display: flex; justify-content: space-between; align-items: center; gap: var(--u); }
  .row { display: flex; justify-content: space-between; gap: var(--u); }
  .k { opacity: .6; }
  .actions { display: flex; gap: var(--u); padding: 0 var(--u) var(--u); flex-wrap: wrap; }
  .actions input { flex: 1; width: 80px; }
  .serial { font-size: 12px; font-weight: 700; padding: 0 var(--u); border: var(--line); }
  .serial.one { background: #fff; color: #000; }
  .countdown { font-variant-numeric: tabular-nums; }
  .countdown.hot { text-decoration: underline; }
  .one .meta { display: flex; justify-content: space-between; align-items: center; gap: var(--u); padding: var(--u) var(--u); font-size: 12px; }
  .chip { font-size: 12px; font-weight: 700; padding: 0 var(--u); border: var(--line); }

  .req { border-bottom: var(--line); padding: var(--u) 0; display: flex; gap: var(--u); align-items: center; justify-content: space-between; }
  .req:first-child { padding-top: 0; }
  .req:last-child { border-bottom: 0; padding-bottom: 0; }
  .req img { width: 40px; flex: none; }
  .req .grow { flex: 1; min-width: 0; }
  .pill { font-size: 12px; font-weight: 700; padding: 0 var(--u); border: var(--line); white-space: nowrap; }
  .pill.done, .pill.winning { background: #fff; color: #000; }
  .pill.failed, .pill.outbid { border-style: dashed; text-decoration: line-through; }
  .pill.waiting, .pill.working { border-style: dotted; }

  .fold summary { list-style: none; cursor: pointer; display: block; }
  .fold summary::-webkit-details-marker { display: none; }
  .fold summary h2 { margin: 0; }
  .fold summary h2::after { content: "+"; margin-left: var(--u); }
  .fold details[open] summary h2 { margin-bottom: var(--u); }
  .fold details[open] summary h2::after { content: "\2212"; }
  .fold summary:hover h2 { text-decoration: underline; }

  .chat { height: 416px; overflow-y: auto; display: flex; flex-direction: column; gap: var(--u); border: var(--line); padding: var(--u); }
  .chat .who { font-weight: 700; }
  .chat .mine { border-left: 2px solid #fff; padding-left: var(--u); }
  .empty { padding: var(--u) 0; text-align: center; opacity: .6; }

  .who-row { display: flex; align-items: center; gap: var(--u); padding: var(--u) var(--u); margin-bottom: var(--u); border: var(--line); }
  .who-row .no { min-width: 48px; text-align: center; font-weight: 700; border: var(--line); padding: 0 var(--u); }
  .who-row .no.n1 { background: #fff; color: #000; }
  .who-row .nm { flex: 1; font-weight: 700; word-break: break-word; }
  .who-row .on { font-size: 12px; }
  /* every outlined box gets the same 10px corners */
  section, .card, .one, .balance, .bidbox, .chat, .who-row, .who-row .no, .serial, .chip, .pill, .switch .track,
  .switch .thumb, .bidbox .dot { border-radius: var(--r); }
  .card, .one { overflow: hidden; }
  .req img { border-radius: var(--r); }
  /* glow fill: a white fill sweeps across a button, tab or mode switch (and its text turns black) with a soft glow;
     cards, rows and inputs glow instead. every motion is 250-300ms and is dropped for people who ask for less motion. */
  :root { --glow: 0 0 16px rgba(255, 255, 255, .55); --glow-soft: 0 0 16px rgba(255, 255, 255, .3); --ease: cubic-bezier(.2, .7, .2, 1); }
  button { position: relative; z-index: 0; overflow: hidden; outline: none;
           transition: color .25s var(--ease), box-shadow .25s var(--ease), transform .1s; }
  button::before { content: ""; position: absolute; inset: 0; z-index: -1; background: #fff;
                   transform: scaleX(0); transform-origin: left center; transition: transform .25s var(--ease); }
  button:focus-visible { box-shadow: var(--glow); }
  button:active { transform: scale(.98); }
  .tab.on, .modes button.on { color: #000; }
  .tab.on::before, .modes button.on::before { transform: scaleX(1); }
  .tab.on, .modes button.on { box-shadow: var(--glow-soft); }
  button:disabled::before { display: none; }
  button:disabled { box-shadow: none; }
  @media (hover: hover) {
    button:not(:disabled):hover { color: #000; box-shadow: var(--glow); }
    button:not(:disabled):hover::before { transform: scaleX(1); }
    .card, .one, .who-row, .req, .balance { transition: box-shadow .3s var(--ease), background-color .3s var(--ease); }
    .card:hover, .one:hover { outline: none; box-shadow: 0 0 0 1px #fff, var(--glow-soft); }
    .who-row:hover { background-color: rgba(255, 255, 255, .08); box-shadow: var(--glow-soft); }
    .fold summary:hover h2 { text-decoration: none; text-shadow: var(--glow); }
    .switch:hover .track { box-shadow: var(--glow); }
  }
  input, select { transition: box-shadow .25s var(--ease); }
  input:focus, select:focus { outline: none; box-shadow: 0 0 0 1px #fff, var(--glow); }
  .switch .track { transition: background-color .25s var(--ease), box-shadow .25s var(--ease); }
  .switch .thumb { transition: transform .25s var(--ease), background-color .25s var(--ease); }
  @media (prefers-reduced-motion: reduce) {
    button, button::before, input, select, .card, .one, .who-row, .switch .track, .switch .thumb { transition: none !important; }
  }
</style>
</head>
<body>
<header>
  <div>
    <div class="brand">
      <img id="logo" class="logo spin" alt="" hidden>
      <span id="logo-fallback" class="logo ring spin"></span>
      <div>
        <h1>fridaes pack bot</h1>
        <div class="status" id="status">connecting…</div>
      </div>
    </div>
  </div>
  <div class="head-right">
    <div class="balance" title="Coins you have right now (coins held in your active bids aren't included)">
      <span class="muted">Balance</span> <b id="balance">…</b> <span class="muted" id="balance-at"></span>
    </div>
    <button class="ghost" id="scan">Check market now</button>
  </div>
</header>
<main>
  <div class="leftcol">
    <div class="tabs" id="tabs">
      <button class="tab on" data-tab="market">Market #1–#3</button>
      <button class="tab" data-tab="mine">My listings &amp; bids <span class="count" id="mine-count"></span></button>
      <button class="tab" data-tab="ones">My #1s <span class="count" id="ones-badge"></span></button>
      <button class="tab" data-tab="who">Who owns?</button>
    </div>
    <section id="tab-market">
      <h2>Serial #1–#3 listings <span class="muted" id="scanned"></span></h2>
      <div class="cards" id="cards"></div>
    </section>
    <section id="tab-mine" hidden>
      <h2>My listings &amp; bids <span class="muted" id="mine-at"></span></h2>
      <div class="muted" id="mine-sum"></div>
      <h3>Bids</h3>
      <div class="cards" id="mine-bids"></div>
      <h3>My listings</h3>
      <div class="cards" id="mine-listings"></div>
    </section>
    <section id="tab-who" hidden>
      <h2>Who owns? <span class="muted" id="who-at"></span></h2>
      <form class="who-form" id="who-form">
        <input id="who-artist" placeholder="Artist (part of the name is fine)" autocomplete="off" maxlength="40">
        <select id="who-rarity"></select>
        <input id="who-find" placeholder="Find # (optional)" inputmode="numeric" maxlength="6" autocomplete="off">
        <button>Look up</button>
      </form>
      <div class="muted" id="who-status"></div>
      <div id="who-rows"></div>
    </section>
    <section id="tab-ones" hidden>
      <h2>My #1s found, all time <span class="muted" id="ones-count"></span></h2>
      <div class="ones" id="ones"></div>
    </section>
  </div>
  <aside>
    <section>
      <h2>What it's doing</h2>
      <div class="modes" id="modes">
        <button class="ghost" data-mode="auto" title="Follow the schedule: fish, event packs, nightly packs and rebirth, hourly market check">Auto (schedule)</button>
        <button class="ghost" data-mode="fish" title="Only fish. No pack sessions, rebirths, Index or hourly market checks">Fish only</button>
        <button class="ghost" data-mode="pause" title="Do nothing (chat, bids and rebirths from here still go through)">Paused</button>
      </div>
      <div class="muted" id="mode-note"></div>
      <div class="modes">
        <button class="ghost" data-do="packs">Open packs now</button>
        <button class="ghost" data-do="index">Record #1s now</button>
      </div>
    </section>
    <section>
      <h2>Rebirth <span class="muted" id="rb-at"></span></h2>
      <div class="rb-stats">
        <div><span class="muted">Rebirths</span> <b id="rb-count">?</b></div>
        <div><span class="muted">Next costs</span> <b id="rb-cost">?</b></div>
        <div><span class="muted">Luck</span> <b id="rb-luck">?</b></div>
      </div>
      <div class="bidbox" id="bidbox"><span class="dot"></span><span id="bid-text">Checking bids…</span></div>
      <label class="switch" title="When you have coins in Market bids, a rebirth asks 'Rebirth anyway?' (those coins are lost). On: it goes ahead. Off: it cancels and tells you.">
        <input type="checkbox" id="anyway"><span class="track"><span class="thumb"></span></span>
        <span class="switch-label">Rebirth anyway <span class="muted" id="anyway-note"></span></span>
      </label>
      <form class="send" id="rb-form">
        <input id="rb-n" type="number" min="1" max="50" value="1" title="how many times">
        <button id="rb-go">Rebirth</button>
      </form>
    </section>
    <section class="fold">
      <details id="log-fold">
        <summary><h2>Your bids &amp; buys log <span class="muted" id="req-count"></span></h2></summary>
        <div id="requests"></div>
      </details>
    </section>
    <section>
      <h2>Game chat <span class="muted">read off the screen</span></h2>
      <div class="chat" id="chat"></div>
      <form class="send" id="send">
        <input id="msg" maxlength="200" placeholder="Say something in game…" autocomplete="off">
        <button>Send</button>
      </form>
      <div class="status" id="outbox"></div>
    </section>
  </aside>
</main>
<script>
const $ = (id) => document.getElementById(id);
// the page is all lowercase, including its pop-up dialogs
const _confirm = window.confirm.bind(window), _alert = window.alert.bind(window);
window.confirm = (m) => _confirm(String(m).toLowerCase());
window.alert = (m) => _alert(String(m).toLowerCase());

// the logo: web/static/logo.svg, .gif, .webp or .png (the first that exists), spinning unless it's a gif
(async function findLogo() {
  try {
    const f = (await (await fetch("/api/logo")).json()).file;
    if (!f) return;  // none: the white spinning ring stays
    const img = $("logo");
    img.src = "/brand/" + f; img.hidden = false; $("logo-fallback").hidden = true;
    img.classList.toggle("spin", !f.endsWith(".gif"));
  } catch {}
})();
const esc = (s) => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
let lastChatLen = 0;

// Only touch a section when its content actually changed (rewriting identical HTML
// reloads every picture, which flashes, and the page can jump while it's rebuilt), and
// keep the scroll position when it does change.
function setHtml(el, html) {
  if (el._html === html) return false;
  el._html = html;
  const y = window.scrollY;
  el.innerHTML = html;
  window.scrollTo(0, y);
  return true;
}

async function post(url, body) {
  const r = await fetch(url, {method: "POST", headers: {"Content-Type": "application/json"}, body: JSON.stringify(body || {})});
  const j = await r.json();
  if (!r.ok) alert(j.error || "Something went wrong");
  return j;
}

function cardHtml(c, i) {
  const one = c.serial === "1";
  const price = c.top_bid || c.current_bid || c.start || "?";
  return `<div class="card">
    ${c.image ? `<img src="/static/cards/${esc(c.image)}?t=${esc(c.seen_at)}" alt="">` : ""}
    <div class="body">
      <div class="name"><span class="serial ${one ? "one" : ""}">#${esc(c.serial)}</span></div>
      <div class="row"><span class="k">${c.top_bidder ? "Top bid" : (c.start ? "Starts at" : "Price")}</span><b>${esc(price)}</b></div>
      ${c.buy_now ? `<div class="row"><span class="k">Buy now</span><b>${esc(c.buy_now)}</b></div>` : ""}
      <div class="row"><span class="k">Top bidder</span><span>${esc(c.top_bidder || "none yet")}</span></div>
      <div class="row"><span class="k">Seller</span><span>${esc(c.seller || "?")}</span></div>
      <div class="row"><span class="k">Ends in</span>${c.ends_ts
        ? `<b class="countdown" data-ends="${c.ends_ts}">${esc(c.time_left)}</b>`
        : `<span>${esc(c.time_left || "?")}</span>`}</div>
    </div>
    <div class="actions">
      <input id="amt${i}" placeholder="e.g. 650B">
      <button data-bid="${i}">Bid</button>
      ${c.buy_now ? `<button class="ghost" data-buy="${i}">Buy now</button>` : ""}
    </div>
  </div>`;
}

function renderOnes(list) {
  const byRarity = {};
  list.forEach(o => byRarity[o.rarity] = (byRarity[o.rarity] || 0) + 1);
  const label = (r) => r.charAt(0).toUpperCase() + r.slice(1).replace("_", " ");
  $("ones-badge").textContent = list.length ? String(list.length) : "";
  $("ones-count").textContent = list.length
    ? `${list.length} total · ` + Object.entries(byRarity).map(([r, n]) => `${n} ${label(r)}`).join(" · ")
    : "";
  const sorted = list.slice().sort((a, b) => (b.found_at || "").localeCompare(a.found_at || ""));
  setHtml($("ones"), sorted.length ? sorted.map(o => `
    <div class="one"><img src="/static/ones/${esc(o.image)}" alt="">
      <div class="meta"><span class="chip ${["blood", "eclipse"].includes(o.rarity) ? esc(o.rarity) : "other"}">${esc(label(o.rarity))}</span>
      <span>found ${esc((o.found_at || "").slice(0, 10))}</span></div></div>`).join("")
    : `<div class="empty">No #1s recorded yet. They're added after each Blood Moon / Eclipse event.</div>`);
}

let cards = [];
let clockOffset = 0;  // bot PC's clock minus this device's clock, in seconds

function fmtLeft(secs) {
  if (secs <= 0) return "ended";
  const h = Math.floor(secs / 3600), m = Math.floor(secs % 3600 / 60), s = Math.floor(secs % 60);
  return (h ? `${h}h ` : "") + (h || m ? `${String(m).padStart(h ? 2 : 1, "0")}m ` : "") + `${String(s).padStart(2, "0")}s`;
}
function mineCardHtml(m, at) {
  const one = m.serial === "1";
  const label = m.kind === "bid" ? (m.status === "outbid" ? "Outbid at" : "Your bid") : "Price";
  return `<div class="card">
    ${m.image ? `<img src="/static/mine/${esc(m.image)}?t=${esc(at)}" alt="">` : ""}
    <div class="body">
      <div class="tag"><span class="serial ${one ? "one" : ""}">${m.serial ? "#" + esc(m.serial) : "card"}</span>
        ${m.status ? `<span class="pill ${esc(m.status)}">${esc(m.status)}</span>` : `<span class="pill">listed</span>`}</div>
      <div class="name">${esc(m.name || "?")}</div>
      <div class="row"><span class="k">${label}</span><b>${esc(m.amount)}</b></div>
      <div class="row"><span class="k">Ends in</span>${m.ends_ts
        ? `<b class="countdown" data-mine-ends="${m.ends_ts}">${esc(m.time_left)}</b>`
        : `<span>${esc(m.time_left || "?")}</span>`}</div>
    </div>
  </div>`;
}

function renderMine(mb) {
  const items = mb.items || [], at = mb.at || "";
  const bids = items.filter(i => i.kind === "bid"), mine = items.filter(i => i.kind !== "bid");
  $("mine-count").textContent = items.length ? String(items.length) : "";
  $("mine-at").textContent = at ? `read from the market at ${at}` : "not read yet";
  $("mine-sum").textContent = mb.at === undefined ? "The bot reads this at each market check (hourly, or press \"Check market now\")."
    : `Selling ${mb.selling ?? "?"}/6 · Winning ${mb.winning ?? 0}${mb.total && mb.total !== "0" ? ` (${mb.total} coins)` : ""} · Requests ${mb.requests ?? "?"}/6`;
  setHtml($("mine-bids"), bids.length ? bids.map(m => mineCardHtml(m, at)).join("") : `<div class="empty">No bids right now.</div>`);
  setHtml($("mine-listings"), mine.length ? mine.map(m => mineCardHtml(m, at)).join("") : `<div class="empty">You have nothing listed for sale.</div>`);
}

const RARITIES = ["common", "uncommon", "rare", "epic", "legendary", "mythic", "secret", "glitched", "kawaii", "radiation",
  "iced", "molten", "charged", "tidal", "spooky", "acid", "meteor", "eclipse", "blood", "atlantis"];
$("who-rarity").innerHTML = RARITIES.map(r => `<option value="${r}">${r}</option>`).join("");

function renderWho(lk, reqs) {
  const latest = reqs.filter(r => r.kind === "lookup" || r.kind === "join").slice(-1)[0];
  const busy = latest && (latest.status === "waiting" || latest.status === "working");
  $("who-status").textContent = latest ? `${latest.kind === "join" ? "Join" : "Look-up"}: ${latest.status}${latest.result ? " - " + latest.result : ""}` : "";
  $("who-at").textContent = lk.at ? `${lk.artist} · ${lk.rarity}${lk.exist ? " · " + lk.exist + " exist" : ""} · read ${lk.at}` : "";
  const rows = lk.rows || [];
  setHtml($("who-rows"), rows.length ? rows.map((r, i) => `<div class="who-row">
      <span class="no ${r.serial <= 3 ? "n" + r.serial : "other"}">#${esc(r.serial)}</span>
      <span class="nm">${esc(r.name || "?")}</span>
      ${r.join ? `<span class="on">online</span><button data-join="${i}" ${busy ? "disabled" : ""}>Join server</button>` : `<span class="muted">not joinable</span>`}
    </div>`).join("") : `<div class="empty">${lk.at ? esc(lk.message || "No owners found.") : "Look up an artist to see who owns their lowest serials."}</div>`);
  window.whoLookup = lk;
}

function showTab(name) {
  document.querySelectorAll(".tab").forEach(b => b.classList.toggle("on", b.dataset.tab === name));
  for (const t of ["market", "mine", "ones", "who"]) $("tab-" + t).hidden = name !== t;
  try { localStorage.setItem("tab", name); } catch {}
}

function tick() {
  const now = Date.now() / 1000 + clockOffset;
  document.querySelectorAll("[data-mine-ends]").forEach(el => {
    const left = +el.dataset.mineEnds - now;
    el.textContent = left <= 0 ? "ended" : fmtLeft(left);
    el.classList.toggle("hot", left > 0 && left < 300);
  });
  document.querySelectorAll("[data-ends]").forEach(el => {
    const left = +el.dataset.ends - now;
    if (left <= 0) {  // the auction ended: take the card off the page
      const card = el.closest(".card");
      if (card) card.remove();
      return;
    }
    el.textContent = fmtLeft(left);
    el.classList.toggle("hot", left < 300);
  });
  if ($("cards") && cards.length && !$("cards").querySelector(".card")) {
    $("cards").innerHTML = `<div class="empty">Those listings have ended. The next market check will bring in new ones.</div>`;
  }
}
setInterval(tick, 1000);

async function refresh() {
  let s;
  try { s = await (await fetch("/api/state")).json(); } catch { $("status").textContent = "can't reach the bot's PC"; return; }
  if (s.now) clockOffset = s.now - Date.now() / 1000;
  $("balance").textContent = s.balance.value || "?";
  $("balance-at").textContent = s.balance.at ? `as of ${s.balance.at}` : "";
  const mode = (s.mode && s.mode.mode) || "auto", queued = (s.mode && s.mode.once) || [];
  document.querySelectorAll("[data-mode]").forEach(b => b.classList.toggle("on", b.dataset.mode === mode));
  $("mode-note").textContent = ({auto: "Following the schedule.", fish: "Only fishing (bids, buys, chat and rebirths still work).",
    pause: "Paused."})[mode] + (queued.length ? ` Queued: ${queued.join(", ")}.` : "");
  // What the market's own My Listings / Requests tabs said at the last market check
  // (the "estimate" from bids placed here is only used until that has been read once)
  const mb = s.mybids || {}, est = s.bids || {count: 0};
  const known = mb.at !== undefined;
  const nBids = known ? mb.winning : est.count, nReq = known ? (mb.requests || 0) : 0;
  const total = known ? mb.total : est.total;
  const held = nBids > 0 || nReq > 0;
  $("bidbox").classList.toggle("has", held);
  $("bid-text").textContent = held
    ? [nBids > 0 ? `${nBids} winning bid${nBids > 1 ? "s" : ""}` + (total && total !== "0" ? ` (${total} coins)` : "") : "",
       nReq > 0 ? `${nReq} request${nReq > 1 ? "s" : ""}` : ""].filter(Boolean).join(" + ") + " — lost if you rebirth"
    : "No coins in bids or requests";
  $("bid-text").title = known ? `Read from the market at ${mb.at}` : "Estimated from bids placed on this page; the market hasn't been read yet";
  $("anyway").checked = !!s.bid_anyway;
  $("anyway-note").textContent = s.bid_anyway ? "(bid coins are lost)" : "(cancels instead)";
  const rb = s.rebirth || {};
  $("rb-count").textContent = rb.rebirths ?? "?";
  $("rb-cost").textContent = rb.cost || "?";
  $("rb-luck").textContent = rb.luck_now ? `x${rb.luck_now} -> x${rb.luck_after ?? "?"}` : "?";
  $("rb-at").textContent = rb.at ? `read ${rb.at}` : "not read yet";
  $("status").textContent = s.status.text ? `Bot: ${s.status.text} (${s.status.at})` : "Bot status unknown";
  const nowSecs = Date.now() / 1000 + clockOffset;
  cards = (s.market.cards || []).filter(c => !c.ends_ts || c.ends_ts > nowSecs);  // drop ended auctions
  $("scanned").textContent = s.market.scanned_at ? `checked ${s.market.scanned_at}` : "not checked yet";
  const focused = document.activeElement && document.activeElement.id.startsWith("amt") ? document.activeElement.id : null;
  const typed = {}; document.querySelectorAll("[id^=amt]").forEach(e => typed[e.id] = e.value);
  if (setHtml($("cards"), cards.length ? cards.map(cardHtml).join("") : `<div class="empty">No #1–#3 listings found yet.</div>`)) {
    Object.entries(typed).forEach(([id, v]) => { if ($(id)) $(id).value = v; });
    if (focused && $(focused)) $(focused).focus({preventScroll: true});
  }
  tick();

  const waiting = s.requests.filter(r => r.status === "waiting" || r.status === "working").length;
  $("req-count").textContent = s.requests.length ? `${s.requests.length}${waiting ? " · " + waiting + " active" : ""}` : "";
  setHtml($("requests"), s.requests.length ? s.requests.slice().reverse().map(r => `
    <div class="req">${r.card.image ? `<img src="/static/cards/${esc(r.card.image)}" alt="">` : ""}
      <div class="grow">${r.kind === "rebirth" ? `<b>Rebirth x${esc(r.amount)}</b>`
        : r.kind === "lookup" ? `<b>Who owns ${esc(r.card.artist)}</b> (${esc(r.card.rarity)}${r.card.find ? " #" + esc(r.card.find) : ""})`
        : r.kind === "join" ? `<b>Join ${esc(r.card.name)}'s server</b> (#${esc(r.card.serial)} ${esc(r.card.artist)})`
        : `<b>${r.kind === "buy" ? "Buy now" : "Bid " + esc(r.amount)}</b> on #${esc(r.card.serial)} from ${esc(r.card.seller || "?")}`}
      <div class="muted">${esc(r.result || r.asked_at)}</div></div>
      <div><span class="pill ${esc(r.status)}">${esc(r.status)}</span>
      ${r.status === "waiting" ? `<button class="ghost" data-cancel="${esc(r.id)}">Cancel</button>` : ""}</div></div>`).join("")
    : `<div class="empty">Nothing yet.</div>`);

  renderChat(s.chat, s.outbox);
  renderMine(s.mybids || {});
  renderWho(s.lookup || {}, s.requests);
  tick();
  renderOnes(s.ones || []);
}

let chatSig = "";
function renderChat(chat, outbox) {
  $("outbox").textContent = outbox.length ? `${outbox.length} message(s) waiting to be sent…` : "";
  const sig = JSON.stringify(chat);
  if (sig === chatSig) return;  // nothing new: leave the box (and the reader's scroll) alone
  chatSig = sig;
  const box = $("chat"), top = box.scrollTop, y = window.scrollY;
  // follow new messages only if you were already at the bottom; if you've scrolled up
  // to read, stay exactly where you were
  const atBottom = !lastChatLen || top + box.clientHeight >= box.scrollHeight - 30;
  box.innerHTML = chat.length ? chat.map(m => `<div class="${m.mine ? "mine" : ""}">
    <span class="muted">${esc(m.at)}</span> ${m.who ? `<span class="who">${esc(m.who)}:</span>` : ""} ${esc(m.text)}</div>`).join("")
    : `<div class="empty">No chat read yet.</div>`;
  box.scrollTop = atBottom ? box.scrollHeight : top;
  window.scrollTo(0, y);
  lastChatLen = chat.length || 1;
}
async function chatTick() {  // the chat is checked every second, the rest of the page every 5
  try { const c = await (await fetch("/api/chat")).json(); renderChat(c.chat, c.outbox); } catch {}
}
setInterval(chatTick, 1000);

document.addEventListener("click", async (e) => {
  const t = e.target;
  if (t.dataset.bid !== undefined) {
    const c = cards[+t.dataset.bid], amount = $("amt" + t.dataset.bid).value.trim();
    if (!amount) return alert("Enter how much to bid, e.g. 650B");
    if (!confirm(`Bid ${amount} on this #${c.serial} card (seller ${c.seller || "?"})?`)) return;
    await post("/api/request", {kind: "bid", amount, card: c}); refresh();
  } else if (t.dataset.buy !== undefined) {
    const c = cards[+t.dataset.buy];
    if (!confirm(`Buy this #${c.serial} card (seller ${c.seller || "?"}) now for ${c.buy_now}?`)) return;
    await post("/api/request", {kind: "buy", amount: c.buy_now, card: c}); refresh();
  } else if (t.dataset.join !== undefined) {
    const lk = window.whoLookup || {}, row = (lk.rows || [])[+t.dataset.join];
    if (!row) return;
    if (!confirm(`Join ${row.name}'s server?\n\nThe bot leaves the server it is in now (including any server boost there) and fishes in theirs.`)) return;
    await post("/api/join", {artist: lk.artist, rarity: lk.rarity, serial: row.serial, name: row.name}); refresh();
  } else if (t.dataset.tab) {
    showTab(t.dataset.tab);
  } else if (t.dataset.mode) {
    await post("/api/mode", {mode: t.dataset.mode}); refresh();
  } else if (t.dataset.do) {
    if (t.dataset.do === "packs" && !confirm("Open every Rainbow-or-rarer and event pack now?")) return;
    await post("/api/do", {what: t.dataset.do}); refresh();
  } else if (t.dataset.cancel) {
    await post(`/api/request/${t.dataset.cancel}/cancel`); refresh();
  } else if (t.id === "scan") {
    await post("/api/scan"); t.textContent = "Asked — the bot will check soon"; setTimeout(() => t.textContent = "Check market now", 4000);
  }
});

$("who-form").addEventListener("submit", async (e) => {
  e.preventDefault();
  const artist = $("who-artist").value.trim();
  if (!artist) return;
  await post("/api/lookup", {artist, rarity: $("who-rarity").value, find: $("who-find").value.trim()});
  refresh();
});

$("anyway").addEventListener("change", async (e) => {
  await post("/api/bidanyway", {on: e.target.checked}); refresh();
});

$("rb-form").addEventListener("submit", async (e) => {
  e.preventDefault();
  const count = Math.max(1, Math.min(50, parseInt($("rb-n").value) || 1));
  const lose = $("anyway").checked && $("bidbox").classList.contains("has")
    ? `\n\nYou have active bids: "Rebirth anyway" is ON, so those bid coins will be lost.` : "";
  if (!confirm(`Rebirth ${count} time${count > 1 ? "s" : ""}? This spends coins.${lose}`)) return;
  await post("/api/rebirth", {count}); refresh();
});

$("send").addEventListener("submit", async (e) => {
  e.preventDefault();
  const text = $("msg").value.trim();
  if (!text) return;
  await post("/api/chat", {text}); $("msg").value = ""; refresh();
});

try { const t = localStorage.getItem("tab"); showTab(["mine", "ones"].includes(t) ? t : "market"); } catch {}
refresh();
setInterval(refresh, 5000);
</script>
</body>
</html>
