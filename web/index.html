<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#07070d">
<title>Underground RNG Control Room</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    color-scheme: dark;
    --bg: #07070d; --panel: rgba(21, 19, 36, .72); --panel-solid: #14122a; --ink: #eceaff; --muted: #8d89aa;
    --line: rgba(255, 255, 255, .09); --line-strong: rgba(255, 255, 255, .16);
    --accent: #a78bfa; --accent2: #22d3ee; --accent3: #f472b6; --accent-ink: #0b0a14;
    --good: #4ade80; --bad: #ff6b81; --warn: #fbbf24;
    --grad: linear-gradient(120deg, #7c5cff 0%, #22d3ee 55%, #f472b6 110%);
    --rainbow: linear-gradient(90deg,#ff4d4d,#ffb54d,#f7f04d,#4dd97a,#4db8ff,#a64dff,#ff4d4d);
    --glow: 0 0 0 1px rgba(167, 139, 250, .35), 0 8px 30px -8px rgba(124, 92, 255, .55);
  }
  * { box-sizing: border-box; }
  html { background: var(--bg); }
  body { margin: 0; color: var(--ink); min-height: 100vh;
         font: 15px/1.45 "Outfit", "Space Grotesk", system-ui, -apple-system, "Segoe UI", sans-serif;
         background:
           radial-gradient(900px 520px at 8% -8%, rgba(124, 92, 255, .24), transparent 60%),
           radial-gradient(820px 520px at 96% 4%, rgba(34, 211, 238, .16), transparent 60%),
           radial-gradient(900px 600px at 50% 112%, rgba(244, 114, 182, .14), transparent 60%),
           var(--bg);
         background-attachment: fixed; }
  ::selection { background: rgba(167, 139, 250, .45); }
  * { scrollbar-width: thin; scrollbar-color: #3a3560 transparent; }
  ::-webkit-scrollbar { width: 9px; height: 9px; }
  ::-webkit-scrollbar-thumb { background: #3a3560; border-radius: 9px; }

  header { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; justify-content: space-between;
           padding: 14px 20px; position: sticky; top: 0; z-index: 5;
           background: rgba(10, 9, 20, .72); backdrop-filter: blur(14px) saturate(1.4);
           border-bottom: 1px solid var(--line); }
  header::after { content: ""; position: absolute; left: 0; right: 0; bottom: -1px; height: 1px;
                  background: var(--grad); opacity: .55; }
  h1 { font-size: 20px; margin: 0; font-weight: 700; letter-spacing: .2px; display: flex; align-items: center; gap: 10px; }
  h1 .logo { background: var(--grad); -webkit-background-clip: text; background-clip: text; color: transparent;
             filter: drop-shadow(0 0 8px rgba(124, 92, 255, .8)); }
  h1 .sub { font-size: 12px; font-weight: 500; color: var(--muted); letter-spacing: 2px; text-transform: uppercase; }
  .status { color: var(--muted); font-size: 13px; display: flex; align-items: center; gap: 7px; }
  .status::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: var(--good);
                    box-shadow: 0 0 10px var(--good); animation: pulse 2s ease-in-out infinite; flex: none; }
  #outbox.status::before { display: none; }
  @keyframes pulse { 50% { opacity: .35; transform: scale(.8); } }
  .balance { border: 1px solid var(--line-strong); border-radius: 12px; padding: 6px 14px;
             background: linear-gradient(180deg, rgba(255,255,255,.06), rgba(255,255,255,.02)); }
  .balance b { font-size: 19px; color: #ffd166; text-shadow: 0 0 14px rgba(255, 209, 102, .55); }
  .balance .muted { font-size: 12px; }

  main { display: grid; grid-template-columns: 1fr 370px; gap: 18px; padding: 18px 20px; max-width: 1500px; margin: 0 auto; }
  @media (max-width: 900px) { main { grid-template-columns: 1fr; } }
  section { background: var(--panel); border: 1px solid var(--line); border-radius: 16px; padding: 16px; min-width: 0;
            backdrop-filter: blur(10px); box-shadow: 0 10px 40px -18px rgba(0, 0, 0, .8), inset 0 1px 0 rgba(255,255,255,.05); }
  h2 { font-size: 13px; margin: 0 0 12px; display: flex; justify-content: space-between; align-items: center; gap: 8px;
       text-transform: uppercase; letter-spacing: 1.6px; font-weight: 700; color: #cfc9f5; }
  h2::before { content: ""; width: 4px; height: 14px; border-radius: 3px; background: var(--grad);
               box-shadow: 0 0 10px rgba(124, 92, 255, .8); margin-right: 2px; }
  h2 { justify-content: flex-start; }
  h2 .muted { margin-left: auto; text-transform: none; letter-spacing: 0; }
  #tab-ones h2 { flex-wrap: wrap; }
  #tab-ones h2 .muted { flex-basis: 100%; margin: 4px 0 0; }
  .muted { color: var(--muted); font-size: 13px; font-weight: normal; }

  button { font: inherit; border: 0; border-radius: 10px; padding: 8px 14px; cursor: pointer;
           background: var(--grad); color: #0b0a14; font-weight: 700; letter-spacing: .2px;
           transition: transform .12s ease, box-shadow .2s ease, filter .2s ease; }
  button:hover { transform: translateY(-1px); box-shadow: var(--glow); filter: brightness(1.08); }
  button:active { transform: translateY(0) scale(.98); }
  button.ghost { background: rgba(255, 255, 255, .04); color: #d9d4ff; border: 1px solid var(--line-strong); }
  button.ghost:hover { background: rgba(167, 139, 250, .14); border-color: rgba(167, 139, 250, .6); }
  button:disabled { opacity: .5; cursor: default; }
  input { font: inherit; padding: 8px 11px; border-radius: 10px; border: 1px solid var(--line-strong);
          background: rgba(8, 7, 18, .7); color: var(--ink); min-width: 0; outline: none; transition: border-color .15s, box-shadow .15s; }
  input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(167, 139, 250, .22); }
  input::placeholder { color: #5f5b7d; }

  .cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 14px; }
  .card { border: 1px solid var(--line); border-radius: 14px; overflow: hidden; display: flex; flex-direction: column;
          background: linear-gradient(180deg, rgba(255,255,255,.05), rgba(255,255,255,.015));
          transition: transform .18s ease, box-shadow .25s ease, border-color .25s ease; }
  .card:hover { transform: translateY(-3px); border-color: rgba(167, 139, 250, .55);
                box-shadow: 0 14px 40px -14px rgba(124, 92, 255, .6); }
  .card img { width: 100%; height: auto; display: block; background: #000; }
  .card .body { padding: 11px; display: grid; gap: 4px; font-size: 13px; }
  .card .name { font-weight: 700; font-size: 14px; display: flex; gap: 6px; align-items: center; }
  .serial { font-size: 12px; font-weight: 800; padding: 2px 9px; border-radius: 7px; color: #1a1300;
            background: linear-gradient(135deg, #ffe08a, #f2a93b); box-shadow: 0 0 12px rgba(242, 169, 59, .45); }
  .serial.one { background: var(--rainbow); background-size: 200% 100%; animation: shimmer 4s linear infinite;
                box-shadow: 0 0 14px rgba(166, 77, 255, .6); }
  @keyframes shimmer { to { background-position: 200% 0; } }
  .row { display: flex; justify-content: space-between; gap: 8px; }
  .k { color: var(--muted); }
  .actions { display: flex; gap: 6px; padding: 0 11px 11px; flex-wrap: wrap; }
  .actions input { flex: 1; width: 80px; }
  .req { border-bottom: 1px solid var(--line); padding: 9px 0; font-size: 13px; display: flex; gap: 8px; align-items: center; justify-content: space-between; }
  .req:last-child { border-bottom: 0; }
  .pill { font-size: 11px; font-weight: 700; padding: 2px 9px; border-radius: 99px; border: 1px solid var(--line-strong);
          white-space: nowrap; text-transform: uppercase; letter-spacing: .6px; }
  .pill.done { color: var(--good); border-color: rgba(74, 222, 128, .45); background: rgba(74, 222, 128, .08); }
  .pill.failed { color: var(--bad); border-color: rgba(255, 107, 129, .45); background: rgba(255, 107, 129, .08); }
  .pill.waiting, .pill.working { color: var(--warn); border-color: rgba(251, 191, 36, .45); background: rgba(251, 191, 36, .08); }
  .chat { height: 420px; overflow-y: auto; font-size: 13px; display: flex; flex-direction: column; gap: 4px;
          border: 1px solid var(--line); border-radius: 12px; padding: 10px; background: rgba(6, 5, 14, .6); }
  .chat > div { padding: 3px 8px; border-radius: 8px; word-break: break-word; }
  .chat > div:hover { background: rgba(255, 255, 255, .04); }
  .modes { display: flex; gap: 7px; flex-wrap: wrap; }
  .modes button.on { background: var(--grad); color: #0b0a14; border-color: transparent; box-shadow: var(--glow); }
  .chat .who { font-weight: 700; color: var(--accent2); }
  .chat .mine { background: rgba(167, 139, 250, .1); }
  .chat .mine .who { color: var(--accent); }
  form.send { display: flex; gap: 7px; margin-top: 10px; }
  form.send input { flex: 1; }
  .empty { color: var(--muted); padding: 22px 0; text-align: center; }
  .wide { max-width: 1500px; margin: 0 auto; padding: 0 20px 30px; }
  .ones { display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 14px; }
  .one { border: 1px solid var(--line); border-radius: 14px; overflow: hidden; background: rgba(255,255,255,.03);
         transition: transform .18s ease, box-shadow .25s ease, border-color .25s ease; }
  .one:hover { transform: translateY(-3px) scale(1.01); border-color: rgba(34, 211, 238, .5);
               box-shadow: 0 14px 40px -14px rgba(34, 211, 238, .45); }
  .one img { width: 100%; height: auto; display: block; }
  .one .meta { display: flex; justify-content: space-between; align-items: center; gap: 6px;
               padding: 8px 10px; font-size: 12px; color: var(--muted); }
  .chip { font-size: 11px; font-weight: 700; padding: 2px 9px; border-radius: 99px; color: #fff; }
  .chip.blood { background: linear-gradient(135deg, #e11d48, #7f1d1d); box-shadow: 0 0 10px rgba(225, 29, 72, .5); }
  .chip.eclipse { background: linear-gradient(135deg, #f59e0b, #b45309); box-shadow: 0 0 10px rgba(245, 158, 11, .5); }
  .chip.other { background: var(--grad); color: #0b0a14; }
  aside { display: grid; gap: 18px; align-content: start; }
  #rb-count { background: var(--grad); -webkit-background-clip: text; background-clip: text; color: transparent;
              filter: drop-shadow(0 0 10px rgba(124, 92, 255, .6)); }
  .fold summary { list-style: none; cursor: pointer; display: block; }
  .fold summary::-webkit-details-marker { display: none; }
  .fold summary h2 { margin: 0; }
  .fold summary h2::after { content: "+"; margin-left: 8px; color: var(--accent2); font-weight: 700; order: 3; }
  .fold details[open] summary h2 { margin-bottom: 12px; }
  .fold details[open] summary h2::after { content: "\2212"; }
  .fold summary:hover h2 { color: #fff; }
  .leftcol { min-width: 0; display: grid; gap: 14px; align-content: start; }
  .tabs { display: flex; gap: 8px; }
  .tab { background: rgba(255,255,255,.04); color: #d9d4ff; border: 1px solid var(--line-strong); }
  .tab.on { background: var(--grad); color: #0b0a14; border-color: transparent; box-shadow: var(--glow); }
  .tab .count { margin-left: 6px; padding: 0 7px; border-radius: 99px; background: rgba(0,0,0,.28); color: #fff; font-size: 12px; }
  .tab .count:empty { display: none; }
  [hidden] { display: none !important; }
  h3 { font-size: 12px; margin: 14px 0 8px; text-transform: uppercase; letter-spacing: 1.4px; color: var(--muted); }
  .card .tag { display: flex; justify-content: space-between; align-items: center; gap: 6px; }
  .pill.winning { color: var(--good); border-color: rgba(74, 222, 128, .45); background: rgba(74, 222, 128, .08); }
  .pill.outbid { color: var(--bad); border-color: rgba(255, 107, 129, .45); background: rgba(255, 107, 129, .08); }
  #mode-note { min-height: 1.3em; }
  .bidbox { display: flex; align-items: center; gap: 8px; margin: 12px 0 8px; padding: 8px 12px; font-size: 13px;
            border-radius: 10px; border: 1px solid var(--line-strong); background: rgba(255, 255, 255, .03); }
  .bidbox .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--good); box-shadow: 0 0 10px var(--good); flex: none; }
  .bidbox.has { border-color: rgba(251, 191, 36, .5); background: rgba(251, 191, 36, .07); }
  .bidbox.has .dot { background: var(--warn); box-shadow: 0 0 10px var(--warn); }
  .switch { display: flex; align-items: center; gap: 10px; cursor: pointer; user-select: none; font-size: 14px; }
  .switch input { position: absolute; opacity: 0; width: 0; height: 0; }
  .switch .track { width: 44px; height: 24px; border-radius: 99px; background: rgba(255, 255, 255, .12); position: relative;
                   border: 1px solid var(--line-strong); transition: background .2s, box-shadow .2s; flex: none; }
  .switch .thumb { position: absolute; top: 2px; left: 2px; width: 18px; height: 18px; border-radius: 50%; background: #cfc9f5;
                   transition: transform .2s, background .2s; }
  .switch input:checked + .track { background: var(--grad); box-shadow: var(--glow); border-color: transparent; }
  .switch input:checked + .track .thumb { transform: translateX(20px); background: #fff; }
  .switch input:focus-visible + .track { outline: 2px solid var(--accent); outline-offset: 2px; }
  .countdown { font-variant-numeric: tabular-nums; }
</style>
</head>
<body>
<header>
  <div>
    <h1><span class="logo">&#9670;</span> Underground RNG <span class="sub">control room</span></h1>
    <div class="status" id="status">connecting…</div>
  </div>
  <div style="display:flex;gap:12px;align-items:center">
    <div class="balance" title="Coins you have right now (coins held in your active bids aren't included)">
      <span class="muted">Balance</span> <b id="balance">…</b> <span class="muted" id="balance-at"></span>
    </div>
    <button class="ghost" id="scan">Check market now</button>
  </div>
</header>
<main>
  <div class="leftcol">
    <div class="tabs" id="tabs">
      <button class="tab on" data-tab="market">Market #1–#3</button>
      <button class="tab" data-tab="mine">My listings &amp; bids <span class="count" id="mine-count"></span></button>
      <button class="tab" data-tab="ones">My #1s <span class="count" id="ones-badge"></span></button>
    </div>
    <section id="tab-market">
      <h2>Serial #1–#3 listings <span class="muted" id="scanned"></span></h2>
      <div class="cards" id="cards"></div>
    </section>
    <section id="tab-mine" hidden>
      <h2>My listings &amp; bids <span class="muted" id="mine-at"></span></h2>
      <div class="muted" id="mine-sum" style="margin-bottom:10px"></div>
      <h3>Bids</h3>
      <div class="cards" id="mine-bids"></div>
      <h3>My listings</h3>
      <div class="cards" id="mine-listings"></div>
    </section>
    <section id="tab-ones" hidden>
      <h2>My #1s found, all time <span class="muted" id="ones-count"></span></h2>
      <div class="ones" id="ones"></div>
    </section>
  </div>
  <aside>
    <section>
      <h2>What it's doing</h2>
      <div class="modes" id="modes">
        <button class="ghost" data-mode="auto" title="Follow the schedule: fish, event packs, nightly packs and rebirth, hourly market check">Auto (schedule)</button>
        <button class="ghost" data-mode="fish" title="Only fish. No pack sessions, rebirths, Index or hourly market checks">Fish only</button>
        <button class="ghost" data-mode="pause" title="Do nothing (chat, bids and rebirths from here still go through)">Paused</button>
      </div>
      <div class="muted" id="mode-note" style="margin:6px 0"></div>
      <div class="modes">
        <button class="ghost" data-do="packs">Open packs now</button>
        <button class="ghost" data-do="index">Record #1s now</button>
      </div>
    </section>
    <section>
      <h2>Rebirth <span class="muted" id="rb-at"></span></h2>
      <div style="display:flex;gap:16px;align-items:baseline;flex-wrap:wrap">
        <div><span class="muted">Rebirths</span> <b id="rb-count" style="font-size:22px">?</b></div>
        <div><span class="muted">Next costs</span> <b id="rb-cost">?</b></div>
        <div><span class="muted">Luck</span> <b id="rb-luck">?</b></div>
      </div>
      <div class="bidbox" id="bidbox"><span class="dot"></span><span id="bid-text">Checking bids…</span></div>
      <label class="switch" title="When you have coins in Market bids, a rebirth asks 'Rebirth anyway?' (those coins are lost). On: it goes ahead. Off: it cancels and tells you.">
        <input type="checkbox" id="anyway"><span class="track"><span class="thumb"></span></span>
        <span class="switch-label">Rebirth anyway <span class="muted" id="anyway-note"></span></span>
      </label>
      <form class="send" id="rb-form" style="margin-top:10px">
        <input id="rb-n" type="number" min="1" max="50" value="1" style="width:70px" title="How many times">
        <button id="rb-go">Rebirth</button>
      </form>
    </section>
    <section class="fold">
      <details id="log-fold">
        <summary><h2>Your bids &amp; buys log <span class="muted" id="req-count"></span></h2></summary>
        <div id="requests"></div>
      </details>
    </section>
    <section>
      <h2>Game chat <span class="muted">read off the screen</span></h2>
      <div class="chat" id="chat"></div>
      <form class="send" id="send">
        <input id="msg" maxlength="200" placeholder="Say something in game…" autocomplete="off">
        <button>Send</button>
      </form>
      <div class="status" id="outbox"></div>
    </section>
  </aside>
</main>
<script>
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
let lastChatLen = 0;

// Only touch a section when its content actually changed (rewriting identical HTML
// reloads every picture, which flashes, and the page can jump while it's rebuilt), and
// keep the scroll position when it does change.
function setHtml(el, html) {
  if (el._html === html) return false;
  el._html = html;
  const y = window.scrollY;
  el.innerHTML = html;
  window.scrollTo(0, y);
  return true;
}

async function post(url, body) {
  const r = await fetch(url, {method: "POST", headers: {"Content-Type": "application/json"}, body: JSON.stringify(body || {})});
  const j = await r.json();
  if (!r.ok) alert(j.error || "Something went wrong");
  return j;
}

function cardHtml(c, i) {
  const one = c.serial === "1";
  const price = c.top_bid || c.current_bid || c.start || "?";
  return `<div class="card">
    ${c.image ? `<img src="/static/cards/${esc(c.image)}?t=${esc(c.seen_at)}" alt="">` : ""}
    <div class="body">
      <div class="name"><span class="serial ${one ? "one" : ""}">#${esc(c.serial)}</span></div>
      <div class="row"><span class="k">${c.top_bidder ? "Top bid" : (c.start ? "Starts at" : "Price")}</span><b>${esc(price)}</b></div>
      ${c.buy_now ? `<div class="row"><span class="k">Buy now</span><b>${esc(c.buy_now)}</b></div>` : ""}
      <div class="row"><span class="k">Top bidder</span><span>${esc(c.top_bidder || "none yet")}</span></div>
      <div class="row"><span class="k">Seller</span><span>${esc(c.seller || "?")}</span></div>
      <div class="row"><span class="k">Ends in</span>${c.ends_ts
        ? `<b class="countdown" data-ends="${c.ends_ts}">${esc(c.time_left)}</b>`
        : `<span>${esc(c.time_left || "?")}</span>`}</div>
    </div>
    <div class="actions">
      <input id="amt${i}" placeholder="e.g. 650B">
      <button data-bid="${i}">Bid</button>
      ${c.buy_now ? `<button class="ghost" data-buy="${i}">Buy now</button>` : ""}
    </div>
  </div>`;
}

function renderOnes(list) {
  const byRarity = {};
  list.forEach(o => byRarity[o.rarity] = (byRarity[o.rarity] || 0) + 1);
  const label = (r) => r.charAt(0).toUpperCase() + r.slice(1).replace("_", " ");
  $("ones-badge").textContent = list.length ? String(list.length) : "";
  $("ones-count").textContent = list.length
    ? `${list.length} total · ` + Object.entries(byRarity).map(([r, n]) => `${n} ${label(r)}`).join(" · ")
    : "";
  const sorted = list.slice().sort((a, b) => (b.found_at || "").localeCompare(a.found_at || ""));
  setHtml($("ones"), sorted.length ? sorted.map(o => `
    <div class="one"><img src="/static/ones/${esc(o.image)}" alt="">
      <div class="meta"><span class="chip ${["blood", "eclipse"].includes(o.rarity) ? esc(o.rarity) : "other"}">${esc(label(o.rarity))}</span>
      <span>found ${esc((o.found_at || "").slice(0, 10))}</span></div></div>`).join("")
    : `<div class="empty">No #1s recorded yet. They're added after each Blood Moon / Eclipse event.</div>`);
}

let cards = [];
let clockOffset = 0;  // bot PC's clock minus this device's clock, in seconds

function fmtLeft(secs) {
  if (secs <= 0) return "ended";
  const h = Math.floor(secs / 3600), m = Math.floor(secs % 3600 / 60), s = Math.floor(secs % 60);
  return (h ? `${h}h ` : "") + (h || m ? `${String(m).padStart(h ? 2 : 1, "0")}m ` : "") + `${String(s).padStart(2, "0")}s`;
}
function mineCardHtml(m, at) {
  const one = m.serial === "1";
  const label = m.kind === "bid" ? (m.status === "outbid" ? "Outbid at" : "Your bid") : "Price";
  return `<div class="card">
    ${m.image ? `<img src="/static/mine/${esc(m.image)}?t=${esc(at)}" alt="">` : ""}
    <div class="body">
      <div class="tag"><span class="serial ${one ? "one" : ""}">${m.serial ? "#" + esc(m.serial) : "card"}</span>
        ${m.status ? `<span class="pill ${esc(m.status)}">${esc(m.status)}</span>` : `<span class="pill">listed</span>`}</div>
      <div class="name">${esc(m.name || "?")}</div>
      <div class="row"><span class="k">${label}</span><b>${esc(m.amount)}</b></div>
      <div class="row"><span class="k">Ends in</span>${m.ends_ts
        ? `<b class="countdown" data-mine-ends="${m.ends_ts}">${esc(m.time_left)}</b>`
        : `<span>${esc(m.time_left || "?")}</span>`}</div>
    </div>
  </div>`;
}

function renderMine(mb) {
  const items = mb.items || [], at = mb.at || "";
  const bids = items.filter(i => i.kind === "bid"), mine = items.filter(i => i.kind !== "bid");
  $("mine-count").textContent = items.length ? String(items.length) : "";
  $("mine-at").textContent = at ? `read from the market at ${at}` : "not read yet";
  $("mine-sum").textContent = mb.at === undefined ? "The bot reads this at each market check (hourly, or press \"Check market now\")."
    : `Selling ${mb.selling ?? "?"}/6 · Winning ${mb.winning ?? 0}${mb.total && mb.total !== "0" ? ` (${mb.total} coins)` : ""} · Requests ${mb.requests ?? "?"}/6`;
  setHtml($("mine-bids"), bids.length ? bids.map(m => mineCardHtml(m, at)).join("") : `<div class="empty">No bids right now.</div>`);
  setHtml($("mine-listings"), mine.length ? mine.map(m => mineCardHtml(m, at)).join("") : `<div class="empty">You have nothing listed for sale.</div>`);
}

function showTab(name) {
  document.querySelectorAll(".tab").forEach(b => b.classList.toggle("on", b.dataset.tab === name));
  for (const t of ["market", "mine", "ones"]) $("tab-" + t).hidden = name !== t;
  try { localStorage.setItem("tab", name); } catch {}
}

function tick() {
  const now = Date.now() / 1000 + clockOffset;
  document.querySelectorAll("[data-mine-ends]").forEach(el => {
    const left = +el.dataset.mineEnds - now;
    el.textContent = left <= 0 ? "ended" : fmtLeft(left);
    el.style.color = left > 0 && left < 300 ? "var(--bad)" : "";
  });
  document.querySelectorAll("[data-ends]").forEach(el => {
    const left = +el.dataset.ends - now;
    if (left <= 0) {  // the auction ended: take the card off the page
      const card = el.closest(".card");
      if (card) card.remove();
      return;
    }
    el.textContent = fmtLeft(left);
    el.style.color = left < 300 ? "var(--bad)" : "";
  });
  if ($("cards") && cards.length && !$("cards").querySelector(".card")) {
    $("cards").innerHTML = `<div class="empty">Those listings have ended. The next market check will bring in new ones.</div>`;
  }
}
setInterval(tick, 1000);

async function refresh() {
  let s;
  try { s = await (await fetch("/api/state")).json(); } catch { $("status").textContent = "can't reach the bot's PC"; return; }
  if (s.now) clockOffset = s.now - Date.now() / 1000;
  $("balance").textContent = s.balance.value || "?";
  $("balance-at").textContent = s.balance.at ? `as of ${s.balance.at}` : "";
  const mode = (s.mode && s.mode.mode) || "auto", queued = (s.mode && s.mode.once) || [];
  document.querySelectorAll("[data-mode]").forEach(b => b.classList.toggle("on", b.dataset.mode === mode));
  $("mode-note").textContent = ({auto: "Following the schedule.", fish: "Only fishing (bids, buys, chat and rebirths still work).",
    pause: "Paused."})[mode] + (queued.length ? ` Queued: ${queued.join(", ")}.` : "");
  // What the market's own My Listings / Requests tabs said at the last market check
  // (the "estimate" from bids placed here is only used until that has been read once)
  const mb = s.mybids || {}, est = s.bids || {count: 0};
  const known = mb.at !== undefined;
  const nBids = known ? mb.winning : est.count, nReq = known ? (mb.requests || 0) : 0;
  const total = known ? mb.total : est.total;
  const held = nBids > 0 || nReq > 0;
  $("bidbox").classList.toggle("has", held);
  $("bid-text").textContent = held
    ? [nBids > 0 ? `${nBids} winning bid${nBids > 1 ? "s" : ""}` + (total && total !== "0" ? ` (${total} coins)` : "") : "",
       nReq > 0 ? `${nReq} request${nReq > 1 ? "s" : ""}` : ""].filter(Boolean).join(" + ") + " — lost if you rebirth"
    : "No coins in bids or requests";
  $("bid-text").title = known ? `Read from the market at ${mb.at}` : "Estimated from bids placed on this page; the market hasn't been read yet";
  $("anyway").checked = !!s.bid_anyway;
  $("anyway-note").textContent = s.bid_anyway ? "(bid coins are lost)" : "(cancels instead)";
  const rb = s.rebirth || {};
  $("rb-count").textContent = rb.rebirths ?? "?";
  $("rb-cost").textContent = rb.cost || "?";
  $("rb-luck").textContent = rb.luck_now ? `x${rb.luck_now} -> x${rb.luck_after ?? "?"}` : "?";
  $("rb-at").textContent = rb.at ? `read ${rb.at}` : "not read yet";
  $("status").textContent = s.status.text ? `Bot: ${s.status.text} (${s.status.at})` : "Bot status unknown";
  const nowSecs = Date.now() / 1000 + clockOffset;
  cards = (s.market.cards || []).filter(c => !c.ends_ts || c.ends_ts > nowSecs);  // drop ended auctions
  $("scanned").textContent = s.market.scanned_at ? `checked ${s.market.scanned_at}` : "not checked yet";
  const focused = document.activeElement && document.activeElement.id.startsWith("amt") ? document.activeElement.id : null;
  const typed = {}; document.querySelectorAll("[id^=amt]").forEach(e => typed[e.id] = e.value);
  if (setHtml($("cards"), cards.length ? cards.map(cardHtml).join("") : `<div class="empty">No #1–#3 listings found yet.</div>`)) {
    Object.entries(typed).forEach(([id, v]) => { if ($(id)) $(id).value = v; });
    if (focused && $(focused)) $(focused).focus({preventScroll: true});
  }
  tick();

  const waiting = s.requests.filter(r => r.status === "waiting" || r.status === "working").length;
  $("req-count").textContent = s.requests.length ? `${s.requests.length}${waiting ? " · " + waiting + " active" : ""}` : "";
  setHtml($("requests"), s.requests.length ? s.requests.slice().reverse().map(r => `
    <div class="req">${r.card.image ? `<img src="/static/cards/${esc(r.card.image)}" alt="" style="width:40px;border-radius:4px">` : ""}
      <div style="flex:1">${r.kind === "rebirth" ? `<b>Rebirth x${esc(r.amount)}</b>` : `<b>${r.kind === "buy" ? "Buy now" : "Bid " + esc(r.amount)}</b> on #${esc(r.card.serial)} from ${esc(r.card.seller || "?")}`}
      <div class="muted">${esc(r.result || r.asked_at)}</div></div>
      <div><span class="pill ${esc(r.status)}">${esc(r.status)}</span>
      ${r.status === "waiting" ? `<button class="ghost" data-cancel="${esc(r.id)}">Cancel</button>` : ""}</div></div>`).join("")
    : `<div class="empty">Nothing yet.</div>`);

  renderChat(s.chat, s.outbox);
  renderMine(s.mybids || {});
  tick();
  renderOnes(s.ones || []);
}

let chatSig = "";
function renderChat(chat, outbox) {
  $("outbox").textContent = outbox.length ? `${outbox.length} message(s) waiting to be sent…` : "";
  const sig = JSON.stringify(chat);
  if (sig === chatSig) return;  // nothing new: leave the box (and the reader's scroll) alone
  chatSig = sig;
  const box = $("chat"), top = box.scrollTop, y = window.scrollY;
  // follow new messages only if you were already at the bottom; if you've scrolled up
  // to read, stay exactly where you were
  const atBottom = !lastChatLen || top + box.clientHeight >= box.scrollHeight - 30;
  box.innerHTML = chat.length ? chat.map(m => `<div class="${m.mine ? "mine" : ""}">
    <span class="muted">${esc(m.at)}</span> ${m.who ? `<span class="who">${esc(m.who)}:</span>` : ""} ${esc(m.text)}</div>`).join("")
    : `<div class="empty">No chat read yet.</div>`;
  box.scrollTop = atBottom ? box.scrollHeight : top;
  window.scrollTo(0, y);
  lastChatLen = chat.length || 1;
}
async function chatTick() {  // the chat is checked every second, the rest of the page every 5
  try { const c = await (await fetch("/api/chat")).json(); renderChat(c.chat, c.outbox); } catch {}
}
setInterval(chatTick, 1000);

document.addEventListener("click", async (e) => {
  const t = e.target;
  if (t.dataset.bid !== undefined) {
    const c = cards[+t.dataset.bid], amount = $("amt" + t.dataset.bid).value.trim();
    if (!amount) return alert("Enter how much to bid, e.g. 650B");
    if (!confirm(`Bid ${amount} on this #${c.serial} card (seller ${c.seller || "?"})?`)) return;
    await post("/api/request", {kind: "bid", amount, card: c}); refresh();
  } else if (t.dataset.buy !== undefined) {
    const c = cards[+t.dataset.buy];
    if (!confirm(`Buy this #${c.serial} card (seller ${c.seller || "?"}) now for ${c.buy_now}?`)) return;
    await post("/api/request", {kind: "buy", amount: c.buy_now, card: c}); refresh();
  } else if (t.dataset.tab) {
    showTab(t.dataset.tab);
  } else if (t.dataset.mode) {
    await post("/api/mode", {mode: t.dataset.mode}); refresh();
  } else if (t.dataset.do) {
    if (t.dataset.do === "packs" && !confirm("Open every Rainbow-or-rarer and event pack now?")) return;
    await post("/api/do", {what: t.dataset.do}); refresh();
  } else if (t.dataset.cancel) {
    await post(`/api/request/${t.dataset.cancel}/cancel`); refresh();
  } else if (t.id === "scan") {
    await post("/api/scan"); t.textContent = "Asked — the bot will check soon"; setTimeout(() => t.textContent = "Check market now", 4000);
  }
});

$("anyway").addEventListener("change", async (e) => {
  await post("/api/bidanyway", {on: e.target.checked}); refresh();
});

$("rb-form").addEventListener("submit", async (e) => {
  e.preventDefault();
  const count = Math.max(1, Math.min(50, parseInt($("rb-n").value) || 1));
  const lose = $("anyway").checked && $("bidbox").classList.contains("has")
    ? `\n\nYou have active bids: "Rebirth anyway" is ON, so those bid coins will be lost.` : "";
  if (!confirm(`Rebirth ${count} time${count > 1 ? "s" : ""}? This spends coins.${lose}`)) return;
  await post("/api/rebirth", {count}); refresh();
});

$("send").addEventListener("submit", async (e) => {
  e.preventDefault();
  const text = $("msg").value.trim();
  if (!text) return;
  await post("/api/chat", {text}); $("msg").value = ""; refresh();
});

try { const t = localStorage.getItem("tab"); showTab(["mine", "ones"].includes(t) ? t : "market"); } catch {}
refresh();
setInterval(refresh, 5000);
</script>
</body>
</html>
